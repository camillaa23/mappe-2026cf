<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8dcc6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Posizioni">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Le mie posizioni</title>
<style>
:root{--bg:#e8dcc6;--ink:#3b3226;--card:#f6efe1;--line:#cdbd9f;--accent:#5b4a35;--red:#a4432f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.screen{display:none;max-width:560px;margin:0 auto;padding:20px 18px 40px}
.screen.on{display:block}
#home.on{display:flex;flex-direction:column;justify-content:center;min-height:100vh;gap:28px}
h1{font-size:1.7rem;margin:0;text-align:center;font-weight:600}
.big{display:flex;gap:16px}
.big button{flex:1;aspect-ratio:1;border:2px solid var(--accent);background:var(--card);color:var(--accent);border-radius:28px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.big button:active{background:#efe3cb}
.big svg{width:48%;height:48%}
.lbl{display:flex;gap:16px;text-align:center;font-size:1rem;margin-top:-14px}
.lbl span{flex:1}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{border:0;background:none;font-size:1rem;color:var(--accent);cursor:pointer;padding:8px 4px;font-family:inherit}
h2{margin:0;font-size:1.3rem}
label{display:block;margin:14px 0 5px;font-size:.95rem}
input,select,textarea{width:100%;padding:12px;font:inherit;font-size:1rem;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.save{margin-top:22px;width:100%;padding:14px;font:inherit;font-size:1.05rem;background:var(--accent);color:#fff;border:0;border-radius:14px;cursor:pointer}
.save:disabled{opacity:.6}
.msg{margin-top:14px;text-align:center;color:var(--accent);min-height:1.4em}
.msg.err{color:var(--red);font-weight:700}
.reg{font-weight:700;font-size:1.35rem;margin:26px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--accent)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item .a{font-weight:600;overflow-wrap:anywhere}
.item .m{font-size:.9rem;color:var(--accent);margin-top:2px}
.item .n{margin-top:6px;font-size:.95rem;white-space:pre-wrap}
.act{display:flex;gap:16px;margin-top:8px;font-size:.9rem;flex-wrap:wrap}
.act a,.act button,.bkbtn{color:var(--accent);background:none;border:0;padding:6px 0;font:inherit;text-decoration:underline;cursor:pointer}
.act .del{color:var(--red)}
.empty{text-align:center;margin-top:40px;color:var(--accent)}
.stat{font-size:.92rem;text-align:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);line-height:1.45}
.stat.warn{border-color:var(--red);border-width:2px}
.stat b{color:var(--red)}
.bkbtn{display:inline-block;margin-top:4px;font-weight:700}
.imp{margin-top:18px;text-align:center;font-size:.9rem}
.imp label{display:inline-block;margin:0;color:var(--accent);text-decoration:underline;cursor:pointer}
details{margin-top:28px;font-size:.95rem}
summary{cursor:pointer;color:var(--accent)}
.alert{display:none;background:var(--red);color:#fff;padding:10px 14px;text-align:center;font-size:.95rem}
</style>
</head>
<body>
<div class="alert" id="alert" role="alert"></div>

<main id="home" class="screen on">
  <h1>Le mie posizioni</h1>
  <div class="big">
    <button id="goAdd" aria-label="Aggiungi posizione">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
    </button>
    <button id="goList" aria-label="Vedi tutte le posizioni">
      <svg viewBox="0 0 24 24"><path fill="#34a853" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><path fill="#4285f4" d="M5 9a7 7 0 0 1 2.2-5.1L12 9.500 8.600 13.300C6.600 11.800 5 10.200 5 9z"/><path fill="#fbbc04" d="M12 2a7 7 0 0 1 5 2.100L12 9.500 7.200 3.900A7 7 0 0 1 12 2z"/><path fill="#ea4335" d="M12 9.500l5-5.400A7 7 0 0 1 19 9c0 1.900-1 4-2.300 6z"/><circle cx="12" cy="9" r="2.600" fill="#fff"/></svg>
    </button>
  </div>
  <div class="lbl"><span>Aggiungi</span><span>Catalogo</span></div>
  <div class="stat" id="stat1"></div>
</main>

<section id="add" class="screen">
  <div class="top"><button class="back" data-back>← Indietro</button><h2 id="addTitle">Nuova posizione</h2></div>
  <label for="f1">Indirizzo</label>
  <input id="f1" autocomplete="off" placeholder="Via, città o link di Google Maps">
  <label for="f2">Regione</label>
  <input id="f2" list="regioni" autocomplete="off" placeholder="Es. Toscana">
  <datalist id="regioni"></datalist>
  <label for="f3">Mese</label>
  <select id="f3"></select>
  <label for="f4">Note</label>
  <textarea id="f4"></textarea>
  <button class="save" id="save">Salva posizione</button>
  <div class="msg" id="msg" role="status"></div>
</section>

<section id="list" class="screen">
  <div class="top"><button class="back" data-back>← Indietro</button><h2>Catalogo</h2></div>
  <div class="stat" id="stat2"></div>
  <label for="flt">Filtra per mese</label>
  <select id="flt"></select>
  <div id="out"></div>
  <details id="trash"><summary id="trashT"></summary><div id="trashL"></div></details>
  <div class="imp"><label for="imp">Ripristina da un backup</label><input id="imp" type="file" accept=".json,application/json" hidden></div>
</section>

<script>
const MESI=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const REGIONI=["Abruzzo","Basilicata","Calabria","Campania","Emilia-Romagna","Friuli-Venezia Giulia","Lazio","Liguria","Lombardia","Marche","Molise","Piemonte","Puglia","Sardegna","Sicilia","Toscana","Trentino-Alto Adige","Umbria","Valle d'Aosta","Veneto"];
const KEY="posizioni_v2";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={ts:0,items:[],lastBackup:0,dirty:0,draft:null},editId=null,storageOk=true;

/* ---------- Salvataggio doppio: localStorage + IndexedDB ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("posizioni_db",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=async()=>{const db=await idb();return new Promise((res,rej)=>{const q=db.transaction("k").objectStore("k").get("data");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const idbSet=async v=>{const db=await idb();return new Promise((res,rej)=>{const t=db.transaction("k","readwrite");t.objectStore("k").put(v,"data");t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
const lsGet=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};

async function persist(){
  S.ts=Date.now();let ok=0;
  try{localStorage.setItem(KEY,JSON.stringify(S));ok++}catch(e){}
  try{await idbSet(JSON.parse(JSON.stringify(S)));ok++}catch(e){}
  return ok>0;
}
async function verify(){ // rilegge davvero i dati salvati
  const a=lsGet();let b=null;try{b=await idbGet()}catch(e){}
  return [a,b].some(x=>x&&x.ts===S.ts&&x.items.length===S.items.length);
}
async function init(){
  let a=lsGet(),b=null;try{b=await idbGet()}catch(e){}
  if(!a){try{const old=JSON.parse(localStorage.getItem("posizioni_v1"));if(Array.isArray(old))a={ts:1,items:old,lastBackup:0,dirty:old.length,draft:null}}catch(e){}}
  const best=[a,b].filter(x=>x&&Array.isArray(x.items)).sort((x,y)=>y.ts-x.ts)[0];
  if(best)S=Object.assign(S,best);
  storageOk=await persist()&&await verify();
  if(navigator.storage&&navigator.storage.persist){try{await navigator.storage.persist()}catch(e){}}
  const al=$("alert");
  if(!storageOk){al.style.display="block";al.textContent="Attenzione: in questo modo di apertura il telefono NON conserva i dati. Non usare l'app così.";}
  else if(location.protocol==="file:"){al.style.display="block";al.style.background="#7a5c2e";al.textContent="Aperta come file: iOS può cancellare i dati. Fai spesso la copia di sicurezza.";}
  renderStat();
}

/* ---------- Backup (si salva in File / iCloud / WhatsApp ecc.) ---------- */
async function backup(){
  const d=new Date().toISOString().slice(0,10);
  const f=new File([JSON.stringify({app:"posizioni",items:S.items})],"posizioni-backup-"+d+".json",{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:"Backup posizioni"})}catch(e){return}
  }else{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
  S.lastBackup=Date.now();S.dirty=0;await persist();renderStat();
  $("msg").textContent="";
}
function renderStat(){
  const n=S.items.filter(p=>!p.deleted).length;
  const days=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;
  let t=`<div>${n} ${n===1?"posizione salvata":"posizioni salvate"}</div>`;
  const warn=S.dirty>0||(n>0&&days===null);
  if(n===0&&!S.lastBackup)t+="<div>Nessuna posizione ancora.</div>";
  else if(S.dirty>0)t+=`<div><b>${S.dirty} ${S.dirty===1?"modifica non è":"modifiche non sono"} ancora nel backup.</b></div><button class="bkbtn" data-bk>Salva copia di sicurezza</button>`;
  else if(days===null)t+=`<div><b>Nessun backup fatto.</b></div><button class="bkbtn" data-bk>Salva copia di sicurezza</button>`;
  else t+=`<div>Backup aggiornato${days>0?" ("+days+" gg fa)":" (oggi)"} ✓</div><button class="bkbtn" data-bk>Salva una nuova copia</button>`;
  ["stat1","stat2"].forEach(i=>{$(i).innerHTML=t;$(i).classList.toggle("warn",warn)});
}
document.addEventListener("click",e=>{if(e.target.closest("[data-bk]"))backup()});

/* ---------- Navigazione ---------- */
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0);if(id==="list")render();renderStat()}
$("f3").innerHTML=MESI.map((m,i)=>`<option value="${i}">${m}</option>`).join("");
$("f3").value=new Date().getMonth();
$("flt").innerHTML='<option value="all">Tutti i mesi</option>'+MESI.map((m,i)=>`<option value="${i}">${m}</option>`).join("");
$("regioni").innerHTML=REGIONI.map(r=>`<option value="${r}">`).join("");
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>show("home"));
$("goList").onclick=()=>show("list");
$("goAdd").onclick=()=>{
  editId=null;$("addTitle").textContent="Nuova posizione";$("save").textContent="Salva posizione";$("msg").textContent="";$("msg").className="msg";
  const d=S.draft||{};$("f1").value=d.a||"";$("f2").value=d.r||"";$("f3").value=d.m!=null?d.m:new Date().getMonth();$("f4").value=d.n||"";
  show("add");
};

/* ---------- Bozza automatica: non perdi ciò che hai scritto ---------- */
let tm;
["f1","f2","f3","f4"].forEach(i=>$(i).addEventListener("input",()=>{
  if(editId)return;clearTimeout(tm);
  tm=setTimeout(()=>{S.draft={a:$("f1").value,r:$("f2").value,m:+$("f3").value,n:$("f4").value};persist()},400);
}));

/* ---------- Salva ---------- */
$("save").onclick=async()=>{
  const m=$("msg"),btn=$("save");m.className="msg";
  const a=$("f1").value.trim(),r=$("f2").value.trim(),mo=+$("f3").value,n=$("f4").value.trim();
  if(!a){m.className="msg err";m.textContent="Manca l'indirizzo.";$("f1").focus();return}
  if(!r){m.className="msg err";m.textContent="Manca la regione.";$("f2").focus();return}
  if(!editId&&S.items.some(p=>!p.deleted&&p.indirizzo.toLowerCase()===a.toLowerCase()&&p.mese===mo)&&!confirm("Questo indirizzo è già salvato per "+MESI[mo]+". Salvarlo di nuovo?"))return;
  btn.disabled=true;
  const backupItems=JSON.stringify(S.items);
  if(editId){const p=S.items.find(x=>x.id===editId);Object.assign(p,{indirizzo:a,regione:r,mese:mo,note:n})}
  else S.items.push({id:Date.now(),indirizzo:a,regione:r,mese:mo,note:n});
  S.dirty++;if(!editId)S.draft=null;
  const ok=await persist()&&await verify();
  btn.disabled=false;
  if(!ok){S.items=JSON.parse(backupItems);S.dirty=Math.max(0,S.dirty-1);
    m.className="msg err";m.textContent="NON salvata! Il telefono non ha conservato i dati. Riprova e fai una copia di sicurezza.";return}
  const total=S.items.filter(p=>!p.deleted).length;
  m.innerHTML=`✓ ${editId?"Modifiche salvate":"Posizione salvata"} (${esc(r)}, ${MESI[mo]}). Totale: ${total}.<br><button class="bkbtn" data-bk>Salva copia di sicurezza</button>`;
  if(editId){editId=null;$("addTitle").textContent="Nuova posizione";$("save").textContent="Salva posizione"}
  $("f1").value="";$("f4").value="";renderStat();
};

/* ---------- Catalogo ---------- */
function card(p,trash){
  const u=/^https?:\/\//i.test(p.indirizzo)?p.indirizzo:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.indirizzo);
  return `<div class="item"><div class="a">${esc(p.indirizzo)}</div><div class="m">${MESI[p.mese]}${trash?" · "+esc(p.regione):""}</div>${p.note?`<div class="n">${esc(p.note)}</div>`:""}<div class="act">${trash?`<button data-res="${p.id}">Ripristina</button>`:`<a href="${esc(u)}" target="_blank" rel="noopener">Apri in Maps</a><button data-edit="${p.id}">Modifica</button><button class="del" data-del="${p.id}">Elimina</button>`}</div></div>`;
}
function render(){
  const f=$("flt").value,all=S.items.filter(p=>!p.deleted),d=all.filter(p=>f==="all"||p.mese===+f);
  if(!d.length)$("out").innerHTML=`<p class="empty">${all.length?"Nessuna posizione per questo mese.":"Nessuna posizione salvata."}</p>`;
  else{
    const g={};d.forEach(p=>{const k=p.regione.toLowerCase();(g[k]=g[k]||{n:p.regione,l:[]}).l.push(p)});
    $("out").innerHTML=Object.values(g).sort((a,b)=>a.n.localeCompare(b.n,"it")).map(x=>`<div class="reg">${esc(x.n)}</div>`+x.l.sort((a,b)=>a.mese-b.mese).map(p=>card(p,false)).join("")).join("");
  }
  const tr=S.items.filter(p=>p.deleted);
  $("trash").style.display=tr.length?"block":"none";
  $("trashT").textContent=`Eliminate di recente (${tr.length})`;
  $("trashL").innerHTML=tr.map(p=>card(p,true)).join("");
}
$("flt").onchange=render;
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-del],[data-res],[data-edit]");if(!b)return;
  if(b.dataset.edit){
    const p=S.items.find(x=>x.id===+b.dataset.edit);editId=p.id;
    $("f1").value=p.indirizzo;$("f2").value=p.regione;$("f3").value=p.mese;$("f4").value=p.note||"";
    $("addTitle").textContent="Modifica posizione";$("save").textContent="Salva modifiche";$("msg").textContent="";show("add");return;
  }
  if(b.dataset.del){if(!confirm("Eliminare questa posizione? Resterà recuperabile in «Eliminate di recente»."))return;
    S.items.find(x=>x.id===+b.dataset.del).deleted=Date.now()}
  else delete S.items.find(x=>x.id===+b.dataset.res).deleted;
  S.dirty++;await persist();render();renderStat();
});

/* ---------- Ripristino da backup (unisce, non cancella nulla) ---------- */
$("imp").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{
    const j=JSON.parse(r.result),arr=Array.isArray(j)?j:j.items;if(!Array.isArray(arr))throw 0;
    const ids=new Set(S.items.map(p=>p.id));let c=0;
    arr.forEach(p=>{if(p&&p.indirizzo&&p.regione&&p.mese>=0&&p.mese<12&&!ids.has(p.id)){S.items.push({id:p.id||Date.now()+c,indirizzo:String(p.indirizzo),regione:String(p.regione),mese:+p.mese,note:p.note||"",deleted:p.deleted});c++}});
    if(c)S.dirty++;await persist();render();renderStat();alert(c?c+" posizioni ripristinate.":"Nessuna posizione nuova: era già tutto presente.");
  }catch(x){alert("File di backup non valido.")}e.target.value=""};
  r.readAsText(f);
};
init();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
